<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>숫자야구 — NUMBER BASEBALL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface-2:   #1c2128;
      --surface-3:   #21262d;
      --border:      #2d3748;
      --border-2:    #3d4f6a;

      --text:        #c9d1d9;
      --text-bright: #f0f6fc;
      --text-dim:    #4a5568;
      --text-subtle: #718096;

      --amber:       #fbbf24;
      --amber-dark:  #92400e;
      --amber-glow:  rgba(251,191,36,.15);

      --strike:      #60a5fa;
      --strike-bg:   rgba(96,165,250,.1);
      --ball:        #34d399;
      --ball-bg:     rgba(52,211,153,.1);
      --out:         #f87171;
      --out-bg:      rgba(248,113,113,.1);

      --px: 'Press Start 2P', cursive;
      --kr: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      font-family: var(--kr);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 5rem;
      position: relative;
    }

    /* CRT scanlines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 2px,
        rgba(0,0,0,.07) 2px,
        rgba(0,0,0,.07) 4px
      );
      pointer-events: none;
      z-index: 1000;
    }

    /* ── HEADER ── */
    header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .header-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1rem;
    }

    .eyebrow-dot {
      width: 6px;
      height: 6px;
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
      animation: blink-dot 2s step-end infinite;
    }

    @keyframes blink-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .eyebrow-text {
      font-family: var(--px);
      font-size: 7px;
      color: var(--amber);
      letter-spacing: 3px;
    }

    .header-title {
      font-family: var(--px);
      font-size: clamp(.9rem, 4vw, 1.4rem);
      line-height: 1.7;
      color: var(--text-bright);
      letter-spacing: 2px;
      margin-bottom: .6rem;
    }

    .header-title em {
      font-style: normal;
      color: var(--amber);
      text-shadow: 0 0 20px rgba(251,191,36,.5);
    }

    .header-sub {
      font-family: var(--kr);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: .5px;
    }

    /* ── CARD ── */
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border-2);
      overflow: hidden;
    }

    .card-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .card-titlebar-label {
      font-family: var(--px);
      font-size: 7px;
      color: var(--text-dim);
      letter-spacing: 2px;
    }

    .traffic-lights {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .tl { width: 9px; height: 9px; border-radius: 50%; }
    .tl-r { background: #ff5f57; box-shadow: 0 0 4px rgba(255,95,87,.5); }
    .tl-y { background: #febc2e; box-shadow: 0 0 4px rgba(254,188,46,.5); }
    .tl-g { background: #28c840; box-shadow: 0 0 4px rgba(40,200,64,.5); }

    .card-body { padding: 1.25rem; }

    /* ── MODE TOGGLE ── */
    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border-2);
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .mtbtn {
      padding: 12px 8px;
      font-family: var(--px);
      font-size: 7px;
      letter-spacing: 1px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-dim);
      transition: all .12s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .mtbtn + .mtbtn { border-left: 1px solid var(--border); }

    .mtbtn.active {
      background: var(--amber);
      color: var(--bg);
    }

    .mtbtn:not(.active):hover {
      background: var(--surface-2);
      color: var(--text-subtle);
    }

    .mtbtn-desc {
      font-family: var(--kr);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.3;
      color: var(--text-dim);
    }

    .mtbtn.active .mtbtn-desc { color: rgba(13,17,23,.65); }

    /* ── DIGIT SELECT ── */
    .dtoggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    .dtoggle-label {
      font-family: var(--px);
      font-size: 7px;
      color: var(--text-dim);
      letter-spacing: 1px;
      margin-right: 4px;
    }

    .tbtn {
      font-family: var(--px);
      font-size: 7px;
      padding: 5px 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      letter-spacing: 1px;
      transition: all .12s;
    }

    .tbtn.active {
      border-color: var(--amber);
      color: var(--amber);
      background: var(--amber-glow);
    }

    .tbtn:not(.active):hover {
      border-color: var(--border-2);
      color: var(--text-subtle);
    }

    /* ── SCORE BAR ── */
    .score-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      margin-bottom: 1.25rem;
    }

    .score-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .score-label {
      font-family: var(--px);
      font-size: 7px;
      color: var(--text-dim);
      letter-spacing: 2px;
    }

    .score-value {
      font-family: var(--px);
      font-size: 16px;
      color: var(--amber);
      text-shadow: 0 0 12px rgba(251,191,36,.4);
      letter-spacing: 3px;
    }

    .score-digits-badge {
      font-family: var(--px);
      font-size: 7px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      padding: 3px 8px;
      letter-spacing: 1px;
    }

    /* ── NUMBER POOL ── */
    .section-label {
      font-family: var(--px);
      font-size: 7px;
      color: var(--text-dim);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .npool {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 4px;
      margin-bottom: 6px;
    }

    .pd {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--px);
      font-size: 11px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      transition: all .08s;
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .pd::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.04) 0%, transparent 100%);
    }

    .pd:hover {
      border-color: var(--amber);
      color: var(--amber);
      box-shadow: 0 0 12px rgba(251,191,36,.2);
    }

    .pd:active { transform: scale(.88); }

    .pd.elim {
      opacity: .15;
      text-decoration: line-through;
      pointer-events: none;
    }

    .pool-hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    /* ── SLOTS ── */
    .drow {
      display: grid;
      grid-template-columns: repeat(var(--digits, 4), 1fr);
      gap: 6px;
      margin-bottom: 1rem;
    }

    .dslot {
      height: 68px;
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--px);
      font-size: 26px;
      color: var(--amber);
      cursor: pointer;
      position: relative;
      transition: all .1s;
      overflow: hidden;
    }

    .dslot.filled {
      border-color: var(--amber);
      background: var(--surface-2);
      box-shadow: 0 0 16px rgba(251,191,36,.08);
    }

    .dslot:not(.filled):hover { background: var(--surface-3); }

    .slothint {
      font-family: var(--px);
      font-size: 7px;
      color: var(--text-dim);
      position: absolute;
      bottom: 6px;
    }

    /* blinking cursor in first empty slot */
    .dslot.cursor-slot::before {
      content: '_';
      font-family: var(--px);
      font-size: 22px;
      color: var(--amber);
      opacity: .8;
      animation: cursor-blink .8s step-start infinite;
    }

    @keyframes cursor-blink { 50% { opacity: 0; } }

    @keyframes slot-pop {
      0%   { transform: scale(.7); opacity: 0; }
      70%  { transform: scale(1.12); }
      100% { transform: scale(1);   opacity: 1; }
    }

    .dslot.pop { animation: slot-pop .18s ease-out; }

    /* ── BUTTONS ── */
    .btnrow {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: .75rem;
    }

    .abtn {
      font-family: var(--px);
      font-size: 7px;
      padding: 10px 14px;
      border: 1px solid var(--border-2);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      letter-spacing: 1px;
      transition: all .1s;
    }

    .abtn:hover {
      background: var(--surface-3);
      border-color: var(--text-subtle);
    }

    .abtn:active { transform: translateY(1px); }

    .abtn.primary {
      background: var(--amber);
      color: var(--bg);
      border-color: var(--amber);
    }

    .abtn.primary:hover {
      background: #f59e0b;
      box-shadow: 0 0 16px rgba(251,191,36,.3);
    }

    .abtn:disabled {
      opacity: .3;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* ── HELPER SELECTS ── */
    .helper-result-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .rlabel {
      font-family: var(--px);
      font-size: 7px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }

    .rselect {
      padding: 7px 10px;
      border: 1px solid var(--border-2);
      background: var(--surface-2);
      color: var(--text);
      font-family: var(--px);
      font-size: 7px;
      cursor: pointer;
      outline: none;
      transition: border-color .1s;
    }

    .rselect:focus { border-color: var(--amber); }

    /* ── STATUS ── */
    .smsg {
      font-family: var(--kr);
      font-size: 12px;
      color: var(--out);
      min-height: 20px;
      line-height: 1.8;
    }

    /* ── WIN ── */
    .wmsg {
      border: 1px solid var(--amber);
      background: var(--amber-glow);
      padding: 18px 16px;
      margin-top: 1rem;
      text-align: center;
    }

    .wmsg-title {
      font-family: var(--px);
      font-size: 12px;
      color: var(--amber);
      margin-bottom: 8px;
      animation: pulse-glow 1.5s ease-in-out infinite;
    }

    .wmsg-sub {
      font-size: 13px;
      color: var(--text);
    }

    @keyframes pulse-glow {
      0%, 100% { text-shadow: 0 0 10px rgba(251,191,36,.4); }
      50%       { text-shadow: 0 0 28px rgba(251,191,36,.9), 0 0 48px rgba(251,191,36,.3); }
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.25rem 0;
    }

    /* ── HISTORY ── */
    .history-header {
      font-family: var(--px);
      font-size: 7px;
      color: var(--text-dim);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .hbox {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .hi {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 2px solid var(--border-2);
      animation: slide-in .2s ease-out;
    }

    .hi:first-child { border-left-color: var(--amber); }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hi-num {
      font-family: var(--px);
      font-size: 15px;
      color: var(--text-bright);
      letter-spacing: 3px;
      min-width: 68px;
    }

    .rbadges { display: flex; gap: 5px; flex-wrap: wrap; }

    .badge {
      font-family: var(--px);
      font-size: 7px;
      padding: 4px 8px;
      letter-spacing: 1px;
    }

    .bs { background: var(--strike-bg); color: var(--strike); border: 1px solid rgba(96,165,250,.3); }
    .bb { background: var(--ball-bg);   color: var(--ball);   border: 1px solid rgba(52,211,153,.3); }
    .bo { background: var(--out-bg);    color: var(--out);    border: 1px solid rgba(248,113,113,.3); }

    /* ── AD SLOT ── */
    .ad-slot {
      width: 100%;
      max-width: 460px;
      margin-top: 1.25rem;
    }

    .ad-slot-label {
      font-family: var(--kr);
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 4px;
      letter-spacing: 1px;
    }

    .ad-slot-inner {
      width: 100%;
      min-height: 100px;
      background: var(--surface);
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      font-family: var(--kr);
      font-size: 12px;
    }

    /* ── BUY ME A COFFEE ── */
    .bmc-wrap {
      margin-top: 1.5rem;
      text-align: center;
    }

    .bmc-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      background: var(--surface);
      border: 1px solid var(--border-2);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: all .15s;
    }

    .bmc-btn:hover {
      border-color: #f5a623;
      color: #f5a623;
      box-shadow: 0 0 14px rgba(245,166,35,.18);
    }

    .bmc-icon { font-size: 15px; }

    .bmc-title {
      font-family: var(--px);
      font-size: 8px;
      letter-spacing: 1px;
    }

    .bmc-sub {
      margin-top: 6px;
      font-family: var(--kr);
      font-size: 11px;
      color: var(--text-dim);
    }

    /* ── QR MODAL ── */
    .qr-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      animation: fadein .15s ease;
    }

    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

    .qr-box {
      background: var(--surface);
      border: 1px solid var(--border-2);
      padding: 2rem 2.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .75rem;
    }

    .qr-box-title {
      font-family: var(--kr);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-bright);
    }

    .qr-box img {
      display: block;
      border: 6px solid #fff;
    }

    .qr-box-sub {
      font-family: var(--kr);
      font-size: 12px;
      color: var(--text-dim);
    }

    .qr-close {
      font-family: var(--px);
      font-size: 7px;
      padding: 8px 18px;
      border: 1px solid var(--border-2);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      letter-spacing: 1px;
      margin-top: .25rem;
      transition: background .1s;
    }

    .qr-close:hover { background: var(--surface-3); }

    /* ── FOOTER ── */
    footer {
      margin-top: 2rem;
      text-align: center;
    }

    .footer-main {
      font-family: var(--px);
      font-size: 7px;
      color: var(--text-dim);
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .footer-sub {
      font-family: var(--kr);
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.8;
    }

    /* ── MOBILE ── */
    @media (max-width: 420px) {
      body { padding: 1.5rem .75rem 4rem; }
      .header-title { font-size: clamp(.75rem, 6vw, 1.1rem); }
      .card-body { padding: 1rem; }
      .pd { font-size: 9px; }
      .dslot { height: 58px; font-size: 22px; }
      .npool { gap: 3px; }
      .dtoggle { flex-wrap: wrap; }
      .score-value { font-size: 14px; }
      .hi-num { font-size: 13px; min-width: 56px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-eyebrow">
    <div class="eyebrow-dot"></div>
    <span class="eyebrow-text">CLASSIC ARCADE GAME</span>
    <div class="eyebrow-dot"></div>
  </div>
  <div class="header-title">NUMBER<br><em>BASEBALL</em></div>
  <div class="header-sub">숫자야구</div>
</header>

<div class="card">
  <div class="card-titlebar">
    <span class="card-titlebar-label">CONTROL PANEL</span>
    <div class="traffic-lights">
      <div class="tl tl-r"></div>
      <div class="tl tl-y"></div>
      <div class="tl tl-g"></div>
    </div>
  </div>

  <div class="card-body">

    <div class="mode-toggle">
      <button class="mtbtn active" id="mode-game" onclick="setMode('game')">
        GAME
        <span class="mtbtn-desc">숨겨진 수를 직접 맞춰요</span>
      </button>
      <button class="mtbtn" id="mode-helper" onclick="setMode('helper')">
        HELPER
        <span class="mtbtn-desc">친구와 할 때 결과를 기록해요</span>
      </button>
    </div>

    <div class="dtoggle">
      <span class="dtoggle-label">DIGITS:</span>
      <button class="tbtn"        id="btn3" onclick="setDigits(3)">3</button>
      <button class="tbtn active" id="btn4" onclick="setDigits(4)">4</button>
    </div>

    <div class="score-bar">
      <div class="score-item">
        <span class="score-label">TRIES</span>
        <span class="score-value" id="tries">000</span>
      </div>
      <span class="score-digits-badge" id="digits-badge">4-DIGIT</span>
    </div>

    <div class="section-label">PICK A NUMBER</div>
    <div class="npool" id="npool"></div>
    <div class="pool-hint">아웃이 나온 숫자는 자동으로 제거돼요</div>

    <!-- 게임 모드 -->
    <div id="game-input-area">
      <div class="drow" id="drow"></div>
      <div class="btnrow">
        <button class="abtn"         onclick="clearLast()">⌫ DEL</button>
        <button class="abtn primary" id="subbtn" onclick="submitGuess()">ENTER ↵</button>
        <button class="abtn"         onclick="startGame()">NEW GAME</button>
      </div>
    </div>

    <!-- 도우미 모드 -->
    <div id="helper-input-area" style="display:none;">
      <div class="drow" id="hdrow"></div>
      <div class="helper-result-row">
        <span class="rlabel">RESULT:</span>
        <select class="rselect" id="sel-strike">
          <option value="0">0S</option>
          <option value="1">1S</option>
          <option value="2">2S</option>
          <option value="3">3S</option>
          <option value="4">4S</option>
        </select>
        <select class="rselect" id="sel-ball">
          <option value="0">0B</option>
          <option value="1">1B</option>
          <option value="2">2B</option>
          <option value="3">3B</option>
          <option value="4">4B</option>
        </select>
      </div>
      <div class="btnrow">
        <button class="abtn"         onclick="clearLastH()">⌫ DEL</button>
        <button class="abtn primary" onclick="submitHelper()">LOG ↵</button>
        <button class="abtn"         onclick="startGame()">RESET</button>
      </div>
    </div>

    <div class="smsg" id="smsg"></div>
    <div id="winarea"></div>

    <div id="history-section" style="display:none;">
      <div class="divider"></div>
      <div class="history-header">── HISTORY ──</div>
      <div class="hbox" id="hbox"></div>
    </div>

  </div>
</div>

<!-- 광고 슬롯 -->
<div class="ad-slot">
  <div class="ad-slot-label">광고</div>
  <div class="ad-slot-inner" id="ad-container">
    <!-- 광고 스크립트를 여기에 삽입하세요 -->
  </div>
</div>

<!-- 커피 사주기 -->
<div class="bmc-wrap">
  <a class="bmc-btn" href="https://qr.kakaopay.com/Ej7wPpW3m1f408605" target="_blank" rel="noopener" onclick="handleBmc(event)">
    <span class="bmc-icon">☕</span>
    <span class="bmc-title">BUY ME A COFFEE</span>
  </a>
  <div class="bmc-sub">카카오페이로 커피 한 잔 사주세요!</div>
</div>

<!-- QR 모달 (데스크탑) -->
<div id="qr-modal" class="qr-modal" style="display:none;" onclick="closeQr()">
  <div class="qr-box" onclick="event.stopPropagation()">
    <div class="qr-box-title">☕ 카카오페이 송금</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&color=000000&bgcolor=ffffff&data=https://qr.kakaopay.com/Ej7wPpW3m1f408605" alt="카카오페이 QR" width="180" height="180">
    <div class="qr-box-sub">QR코드를 스캔해 주세요</div>
    <button class="qr-close" onclick="closeQr()">CLOSE</button>
  </div>
</div>

<footer>
  <div class="footer-main">⚾ NUMBER BASEBALL · v1.0</div>
  <div class="footer-sub">
    숫자를 눌러 입력 · ENTER로 제출 · Backspace로 삭제
  </div>
</footer>

<script>
  var secret = '', tries = 0, gameOver = false, digits = 4;
  var current = [], hcurrent = [], eliminated = {};
  var ORDER = ['1','2','3','4','5','6','7','8','9','0'];
  var mode = 'game';

  /* ── HELPERS ── */
  function fmt(n)     { return String(n).padStart(3, '0'); }
  function setMsg(m)  { document.getElementById('smsg').textContent = m; }
  function clearMsg() { document.getElementById('smsg').textContent = ''; }

  /* ── MODE / DIGIT SETUP ── */
  function setMode(m) {
    mode = m;
    document.getElementById('mode-game').className   = 'mtbtn' + (m === 'game'   ? ' active' : '');
    document.getElementById('mode-helper').className = 'mtbtn' + (m === 'helper' ? ' active' : '');
    document.getElementById('game-input-area').style.display   = m === 'game'   ? '' : 'none';
    document.getElementById('helper-input-area').style.display = m === 'helper' ? '' : 'none';
    startGame();
  }

  function setDigits(n) {
    digits = n;
    document.getElementById('btn3').className = 'tbtn' + (n === 3 ? ' active' : '');
    document.getElementById('btn4').className = 'tbtn' + (n === 4 ? ' active' : '');
    document.getElementById('digits-badge').textContent = n + '-DIGIT';
    document.documentElement.style.setProperty('--digits', n);

    var ss = document.getElementById('sel-strike');
    var sb = document.getElementById('sel-ball');
    while (ss.options.length > n + 1) ss.remove(ss.options.length - 1);
    while (ss.options.length < n + 1) {
      var o = document.createElement('option');
      o.value = ss.options.length; o.textContent = ss.options.length + 'S';
      ss.appendChild(o);
    }
    while (sb.options.length > n + 1) sb.remove(sb.options.length - 1);
    while (sb.options.length < n + 1) {
      var o = document.createElement('option');
      o.value = sb.options.length; o.textContent = sb.options.length + 'B';
      sb.appendChild(o);
    }
    startGame();
  }

  /* ── GAME LOGIC ── */
  function genSecret() {
    var pool = ORDER.slice().sort(function() { return Math.random() - .5; }).slice(0, digits);
    if (pool[0] === '0') {
      var i = Math.floor(Math.random() * (digits - 1)) + 1;
      var t = pool[0]; pool[0] = pool[i]; pool[i] = t;
    }
    return pool.join('');
  }

  function startGame() {
    secret = genSecret();
    tries = 0; gameOver = false;
    current = []; hcurrent = []; eliminated = {};
    document.getElementById('tries').textContent = '000';
    document.getElementById('hbox').innerHTML = '';
    document.getElementById('winarea').innerHTML = '';
    document.getElementById('history-section').style.display = 'none';
    clearMsg();
    var sb = document.getElementById('subbtn');
    if (sb) sb.disabled = false;
    document.documentElement.style.setProperty('--digits', digits);
    renderPool(); renderDisplay(); renderDisplayH();
  }

  /* ── RENDER ── */
  function renderPool() {
    var c = document.getElementById('npool');
    c.innerHTML = '';
    for (var i = 0; i < ORDER.length; i++) {
      var d = ORDER[i];
      var el = document.createElement('div');
      el.className = 'pd' + (eliminated[d] ? ' elim' : '');
      el.textContent = d;
      (function(digit) {
        el.addEventListener('click', function() {
          if (mode === 'game') addDigit(digit); else addDigitH(digit);
        });
      })(d);
      c.appendChild(el);
    }
  }

  function renderDisplay() {
    var row = document.getElementById('drow');
    row.innerHTML = '';
    var firstEmpty = -1;
    for (var i = 0; i < digits; i++) {
      if (!current[i] && firstEmpty === -1) firstEmpty = i;
      var slot = document.createElement('div');
      slot.className = 'dslot' + (current[i] ? ' filled' : '') + (!current[i] && i === firstEmpty ? ' cursor-slot' : '');
      if (current[i]) {
        slot.textContent = current[i];
      } else {
        var h = document.createElement('span'); h.className = 'slothint'; h.textContent = i + 1; slot.appendChild(h);
      }
      (function(idx) { slot.addEventListener('click', function() { removeAt(idx); }); })(i);
      row.appendChild(slot);
    }
  }

  function renderDisplayH() {
    var row = document.getElementById('hdrow');
    row.innerHTML = '';
    var firstEmpty = -1;
    for (var i = 0; i < digits; i++) {
      if (!hcurrent[i] && firstEmpty === -1) firstEmpty = i;
      var slot = document.createElement('div');
      slot.className = 'dslot' + (hcurrent[i] ? ' filled' : '') + (!hcurrent[i] && i === firstEmpty ? ' cursor-slot' : '');
      if (hcurrent[i]) {
        slot.textContent = hcurrent[i];
      } else {
        var h = document.createElement('span'); h.className = 'slothint'; h.textContent = i + 1; slot.appendChild(h);
      }
      (function(idx) { slot.addEventListener('click', function() { removeAtH(idx); }); })(i);
      row.appendChild(slot);
    }
  }

  /* ── INPUT ── */
  function addDigit(d) {
    if (gameOver) return;
    if (current.length >= digits) { setMsg('이미 ' + digits + '자리를 입력했어요'); return; }
    for (var i = 0; i < current.length; i++) { if (current[i] === d) { setMsg('이미 입력된 숫자예요'); return; } }
    if (current.length === 0 && d === '0') { setMsg('첫 번째 자리는 0이 될 수 없어요'); return; }
    clearMsg();
    current.push(d);
    renderDisplay();
    var slots = document.getElementById('drow').querySelectorAll('.dslot');
    var s = slots[current.length - 1];
    if (s) { s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); }
  }

  function addDigitH(d) {
    if (hcurrent.length >= digits) { setMsg('이미 ' + digits + '자리를 입력했어요'); return; }
    for (var i = 0; i < hcurrent.length; i++) { if (hcurrent[i] === d) { setMsg('이미 입력된 숫자예요'); return; } }
    if (hcurrent.length === 0 && d === '0') { setMsg('첫 번째 자리는 0이 될 수 없어요'); return; }
    clearMsg();
    hcurrent.push(d);
    renderDisplayH();
  }

  function removeAt(idx)  { if (gameOver) return; if (idx < current.length)  { current.splice(idx, 1);  renderDisplay();  } }
  function removeAtH(idx) { if (idx < hcurrent.length) { hcurrent.splice(idx, 1); renderDisplayH(); } }
  function clearLast()    { if (gameOver) return; current.pop();  renderDisplay();  }
  function clearLastH()   { hcurrent.pop(); renderDisplayH(); }

  /* ── SUBMIT ── */
  function submitGuess() {
    if (gameOver) return;
    if (current.length !== digits) { setMsg(digits + '자리를 모두 입력해 주세요'); return; }
    var guess = current.join('');
    clearMsg();
    tries++; document.getElementById('tries').textContent = fmt(tries);

    var s = 0, b = 0;
    for (var i = 0; i < digits; i++) {
      if (guess[i] === secret[i]) s++;
      else if (secret.indexOf(guess[i]) >= 0) b++;
    }
    var isOut = (s === 0 && b === 0);
    if (isOut) { for (var i = 0; i < digits; i++) eliminated[guess[i]] = true; }
    renderPool();
    addHistory(guess, s, b, isOut);
    current = []; renderDisplay();

    if (s === digits) {
      gameOver = true;
      document.getElementById('subbtn').disabled = true;
      document.getElementById('winarea').innerHTML =
        '<div class="wmsg"><div class="wmsg-title">PERFECT!</div>' +
        '<div class="wmsg-sub">' + tries + '번 만에 정답을 맞혔어요</div></div>';
    }
  }

  function submitHelper() {
    if (hcurrent.length !== digits) { setMsg(digits + '자리를 모두 입력해 주세요'); return; }
    var guess = hcurrent.join('');
    var s = parseInt(document.getElementById('sel-strike').value);
    var b = parseInt(document.getElementById('sel-ball').value);
    if (s + b > digits) { setMsg('스트라이크 + 볼은 ' + digits + '를 초과할 수 없어요'); return; }
    clearMsg();
    tries++; document.getElementById('tries').textContent = fmt(tries);

    var isOut = (s === 0 && b === 0);
    if (isOut) { for (var i = 0; i < digits; i++) eliminated[guess[i]] = true; }
    renderPool();
    addHistory(guess, s, b, isOut);
    hcurrent = []; renderDisplayH();
    document.getElementById('sel-strike').value = '0';
    document.getElementById('sel-ball').value   = '0';

    if (s === digits) {
      document.getElementById('winarea').innerHTML =
        '<div class="wmsg"><div class="wmsg-title">FOUND IT!</div>' +
        '<div class="wmsg-sub">' + tries + '번 만에 정답을 찾았어요</div></div>';
    }
  }

  /* ── HISTORY ── */
  function addHistory(guess, s, b, isOut) {
    document.getElementById('history-section').style.display = '';
    var item = document.createElement('div'); item.className = 'hi';
    var num = document.createElement('span'); num.className = 'hi-num'; num.textContent = guess;
    var badges = document.createElement('div'); badges.className = 'rbadges';

    if (s > 0) { var bd = document.createElement('span'); bd.className = 'badge bs'; bd.textContent = s + 'S'; badges.appendChild(bd); }
    if (b > 0) { var bd = document.createElement('span'); bd.className = 'badge bb'; bd.textContent = b + 'B'; badges.appendChild(bd); }
    if (isOut) { var bd = document.createElement('span'); bd.className = 'badge bo'; bd.textContent = 'OUT';  badges.appendChild(bd); }

    item.appendChild(num); item.appendChild(badges);
    var hbox = document.getElementById('hbox');
    hbox.insertBefore(item, hbox.firstChild);
  }

  /* ── KEYBOARD ── */
  document.addEventListener('keydown', function(e) {
    if (e.key >= '0' && e.key <= '9') {
      if (mode === 'game' && !gameOver) addDigit(e.key);
      else if (mode === 'helper') addDigitH(e.key);
    } else if (e.key === 'Backspace') {
      if (mode === 'game' && !gameOver) clearLast();
      else if (mode === 'helper') clearLastH();
    } else if (e.key === 'Enter') {
      if (mode === 'game' && !gameOver) submitGuess();
      else if (mode === 'helper') submitHelper();
    }
  });

  /* ── KAKAO PAY QR ── */
  function isMobile() {
    return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  }

  function handleBmc(e) {
    if (isMobile()) return; // 모바일: 링크 그대로 열기
    e.preventDefault();
    document.getElementById('qr-modal').style.display = 'flex';
  }

  function closeQr() {
    document.getElementById('qr-modal').style.display = 'none';
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeQr();
  });

  startGame();
</script>
</body>
</html>
