<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta property="og:image" content="https://catchnumberbaseball.netlify.app/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="twitter:image" content="https://catchnumberbaseball.netlify.app/og-image.svg">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><rect width='16' height='16' fill='%230d1117'/><rect x='4' y='1' width='8' height='1' fill='%23fbbf24'/><rect x='2' y='2' width='12' height='1' fill='%23fbbf24'/><rect x='1' y='3' width='1' height='10' fill='%23fbbf24'/><rect x='14' y='3' width='1' height='10' fill='%23fbbf24'/><rect x='2' y='13' width='12' height='1' fill='%23fbbf24'/><rect x='4' y='14' width='8' height='1' fill='%23fbbf24'/><rect x='2' y='3' width='12' height='10' fill='%230d1117'/><rect x='4' y='3' width='2' height='1' fill='%23fbbf24'/><rect x='3' y='4' width='1' height='2' fill='%23fbbf24'/><rect x='4' y='6' width='1' height='1' fill='%23fbbf24'/><rect x='5' y='7' width='1' height='2' fill='%23fbbf24'/><rect x='4' y='9' width='1' height='1' fill='%23fbbf24'/><rect x='3' y='10' width='1' height='2' fill='%23fbbf24'/><rect x='4' y='12' width='2' height='1' fill='%23fbbf24'/><rect x='10' y='3' width='2' height='1' fill='%23fbbf24'/><rect x='12' y='4' width='1' height='2' fill='%23fbbf24'/><rect x='11' y='6' width='1' height='1' fill='%23fbbf24'/><rect x='10' y='7' width='1' height='2' fill='%23fbbf24'/><rect x='11' y='9' width='1' height='1' fill='%23fbbf24'/><rect x='12' y='10' width='1' height='2' fill='%23fbbf24'/><rect x='10' y='12' width='2' height='1' fill='%23fbbf24'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/static/pretendard.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface-2:   #1c2128;
      --surface-3:   #21262d;
      --border:      #2d3748;
      --border-2:    #3d4f6a;
      --text:        #c9d1d9;
      --text-bright: #f0f6fc;
      --text-dim:    #4a5568;
      --text-subtle: #718096;
      --amber:       #fbbf24;
      --amber-dark:  #92400e;
      --amber-glow:  rgba(251,191,36,.15);
      --strike:      #60a5fa;
      --strike-bg:   rgba(96,165,250,.1);
      --ball:        #34d399;
      --ball-bg:     rgba(52,211,153,.1);
      --out:         #f87171;
      --out-bg:      rgba(248,113,113,.1);
      --px: 'Press Start 2P', cursive;
      --kr: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      font-family: var(--kr);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 5rem;
      position: relative;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,.07) 2px, rgba(0,0,0,.07) 4px);
      pointer-events: none;
      z-index: 1000;
    }

    header { text-align: center; margin-bottom: 2.25rem; }

    .header-eyebrow { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 1rem; }

    .eyebrow-dot { width: 6px; height: 6px; background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: blink-dot 2s step-end infinite; }

    @keyframes blink-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .eyebrow-text { font-family: var(--px); font-size: 7px; color: var(--amber); letter-spacing: 3px; }

    .header-title { font-family: var(--px); font-size: clamp(.9rem, 4vw, 1.4rem); line-height: 1.7; color: var(--text-bright); letter-spacing: 2px; margin-bottom: .6rem; }

    .header-title em { font-style: normal; color: var(--amber); text-shadow: 0 0 20px rgba(251,191,36,.5); }

    .header-sub { font-family: var(--kr); font-size: 13px; font-weight: 500; color: var(--text-dim); letter-spacing: .5px; }

    .card { width: 100%; max-width: 460px; background: var(--surface); border: 1px solid var(--border-2); overflow: hidden; }

    .card-titlebar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); }

    .card-titlebar-label { font-family: var(--px); font-size: 7px; color: var(--text-dim); letter-spacing: 2px; }

    .traffic-lights { display: flex; gap: 5px; align-items: center; }

    .tl { width: 9px; height: 9px; border-radius: 50%; }
    .tl-r { background: #ff5f57; box-shadow: 0 0 4px rgba(255,95,87,.5); }
    .tl-y { background: #febc2e; box-shadow: 0 0 4px rgba(254,188,46,.5); }
    .tl-g { background: #28c840; box-shadow: 0 0 4px rgba(40,200,64,.5); }

    .card-body { padding: 1.25rem; }

    .mode-toggle { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border-2); margin-bottom: 1.25rem; overflow: hidden; }

    .mtbtn { padding: 12px 8px; font-family: var(--px); font-size: 7px; letter-spacing: 1px; cursor: pointer; border: none; background: transparent; color: var(--text-dim); transition: all .12s; display: flex; flex-direction: column; align-items: center; gap: 6px; }

    .mtbtn + .mtbtn { border-left: 1px solid var(--border); }

    .mtbtn.active { background: var(--amber); color: var(--bg); }

    .mtbtn:not(.active):hover { background: var(--surface-2); color: var(--text-subtle); }

    .mtbtn-desc { font-family: var(--kr); font-size: 11px; font-weight: 400; letter-spacing: 0; line-height: 1.3; color: var(--text-dim); }

    .mtbtn.active .mtbtn-desc { color: rgba(13,17,23,.65); }

    .dtoggle { display: flex; align-items: center; gap: 8px; margin-bottom: 1.25rem; }

    .dtoggle-label { font-family: var(--px); font-size: 7px; color: var(--text-dim); letter-spacing: 1px; margin-right: 4px; }

    .tbtn { font-family: var(--px); font-size: 7px; padding: 5px 14px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; letter-spacing: 1px; transition: all .12s; }

    .tbtn.active { border-color: var(--amber); color: var(--amber); background: var(--amber-glow); }

    .tbtn:not(.active):hover { border-color: var(--border-2); color: var(--text-subtle); }

    .score-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; background: var(--surface-3); border: 1px solid var(--border); margin-bottom: 1.25rem; }

    .score-item { display: flex; align-items: center; gap: 10px; }

    .score-label { font-family: var(--px); font-size: 7px; color: var(--text-dim); letter-spacing: 2px; }

    .score-value { font-family: var(--px); font-size: 16px; color: var(--amber); text-shadow: 0 0 12px rgba(251,191,36,.4); letter-spacing: 3px; }

    .score-digits-badge { font-family: var(--px); font-size: 7px; color: var(--text-dim); border: 1px solid var(--border); padding: 3px 8px; letter-spacing: 1px; }

    .section-label { font-family: var(--px); font-size: 7px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 8px; }

    .npool { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-bottom: 6px; }

    .pd { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-family: var(--px); font-size: 11px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; transition: all .08s; user-select: none; position: relative; overflow: hidden; }

    .pd::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.04) 0%, transparent 100%); }

    .pd:hover { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 12px rgba(251,191,36,.2); }

    .pd:active { transform: scale(.88); }

    .pd.elim { opacity: .15; text-decoration: line-through; pointer-events: none; }


    .drow { display: grid; grid-template-columns: repeat(var(--digits, 4), 1fr); gap: 6px; margin-bottom: 1rem; }

    .dslot { height: 68px; border: 1px solid var(--border); background: var(--bg); display: flex; align-items: center; justify-content: center; font-family: var(--px); font-size: 26px; color: var(--amber); cursor: pointer; position: relative; transition: all .1s; overflow: hidden; }

    .dslot.filled { border-color: var(--amber); background: var(--surface-2); box-shadow: 0 0 16px rgba(251,191,36,.08); }

    .dslot:not(.filled):hover { background: var(--surface-3); }

    .slothint { font-family: var(--px); font-size: 7px; color: var(--text-dim); position: absolute; bottom: 6px; }

    .dslot.cursor-slot::before { content: '_'; font-family: var(--px); font-size: 22px; color: var(--amber); opacity: .8; animation: cursor-blink .8s step-start infinite; }

    @keyframes cursor-blink { 50% { opacity: 0; } }

    @keyframes slot-pop { 0% { transform: scale(.7); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

    .dslot.pop { animation: slot-pop .18s ease-out; }

    .btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: .75rem; }

    .abtn { font-family: var(--px); font-size: 7px; padding: 10px 14px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); cursor: pointer; letter-spacing: 1px; transition: all .1s; }

    .abtn:hover { background: var(--surface-3); border-color: var(--text-subtle); }

    .abtn:active { transform: translateY(1px); }

    .abtn.primary { background: var(--amber); color: var(--bg); border-color: var(--amber); }

    .abtn.primary:hover { background: #f59e0b; box-shadow: 0 0 16px rgba(251,191,36,.3); }

    .abtn:disabled { opacity: .3; cursor: not-allowed; pointer-events: none; }

    .helper-result-row { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }

    .rlabel { font-family: var(--px); font-size: 7px; color: var(--text-dim); letter-spacing: 1px; }

    .result-select-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1rem; }
    .result-select-row { display: flex; align-items: center; gap: 10px; }
    .result-btns { display: flex; gap: 4px; flex-wrap: wrap; }
    .rbtn { font-family: var(--px); font-size: 7px; padding: 7px 11px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; letter-spacing: 1px; transition: all .1s; }
    .rbtn:hover:not(:disabled) { border-color: var(--border-2); color: var(--text-subtle); }
    .rbtn.active { border-color: var(--amber); color: var(--amber); background: var(--amber-glow); }
    .rbtn:disabled { opacity: .2; cursor: not-allowed; }

    /* ── SECRET SETUP ── */
    .secret-setup-header { text-align: center; padding: 1.25rem 0 1rem; }
    .secret-step-badge { font-family: var(--px); font-size: 7px; color: var(--strike); letter-spacing: 2px; margin-bottom: .75rem; }
    .secret-setup-title { font-family: var(--kr); font-size: 18px; font-weight: 700; color: var(--text-bright); margin-bottom: .4rem; }
    .secret-setup-desc { font-family: var(--kr); font-size: 13px; color: var(--text-subtle); }
    .secret-drow .dslot { border-color: var(--strike); color: var(--strike); }
    .secret-drow .dslot.filled { background: var(--strike-bg); border-color: var(--strike); box-shadow: 0 0 16px rgba(96,165,250,.12); }
    .secret-drow .dslot.cursor-slot::before { color: var(--strike); }

    /* ── HELPER TABS ── */
    .helper-tab-toggle { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--border-2); margin-bottom: 1.25rem; overflow: hidden; }

    .htbtn { padding: 10px 8px; font-family: var(--px); font-size: 7px; letter-spacing: 1px; cursor: pointer; border: none; border-bottom: 2px solid transparent; background: transparent; color: var(--text-dim); transition: all .12s; display: flex; flex-direction: column; align-items: center; gap: 5px; }

    .htbtn + .htbtn { border-left: 1px solid var(--border); }

    .htbtn.active { background: var(--surface-3); color: var(--text-bright); border-bottom-color: var(--amber); }

    .htbtn:not(.active):hover { background: var(--surface-2); }

    .htbtn-desc { font-family: var(--kr); font-size: 10px; letter-spacing: 0; opacity: .75; }

    /* ── MY SECRET BAR ── */
    .my-secret-bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--surface-3); border: 1px solid var(--border); margin-bottom: 1.25rem; }

    .my-secret-lbl { font-family: var(--px); font-size: 7px; color: var(--text-dim); letter-spacing: 1px; }

    .my-secret-dots { font-family: var(--px); font-size: 14px; color: var(--amber); letter-spacing: 5px; }

    .mini-btn { font-family: var(--px); font-size: 6px; padding: 4px 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; letter-spacing: 1px; transition: all .1s; }

    .mini-btn:hover { border-color: var(--out); color: var(--out); }

    /* ── THEIR RESULT ── */
    .their-result-box { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 16px; background: var(--surface-3); border: 1px solid var(--border); margin-bottom: 1rem; }

    .smsg { font-family: var(--kr); font-size: 12px; color: var(--out); min-height: 20px; line-height: 1.8; }

    .wmsg { border: 1px solid var(--amber); background: var(--amber-glow); padding: 18px 16px; margin-top: 1rem; text-align: center; }

    .wmsg-title { font-family: var(--px); font-size: 12px; color: var(--amber); margin-bottom: 8px; animation: pulse-glow 1.5s ease-in-out infinite; }

    .wmsg-sub { font-size: 13px; color: var(--text); }

    @keyframes pulse-glow { 0%, 100% { text-shadow: 0 0 10px rgba(251,191,36,.4); } 50% { text-shadow: 0 0 28px rgba(251,191,36,.9), 0 0 48px rgba(251,191,36,.3); } }

    .divider { height: 1px; background: var(--border); margin: 1.25rem 0; }

    .history-header { font-family: var(--px); font-size: 7px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 8px; }

    .hbox { display: flex; flex-direction: column; gap: 4px; }

    .hi { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border); border-left: 2px solid var(--border-2); animation: slide-in .2s ease-out; }

    .hi:first-child { border-left-color: var(--amber); }

    .hi.their { border-left-color: var(--strike); }

    @keyframes slide-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    .hi-num { font-family: var(--px); font-size: 15px; color: var(--text-bright); letter-spacing: 3px; min-width: 68px; }

    .hi-who { font-family: var(--px); font-size: 6px; color: var(--text-dim); letter-spacing: 1px; }

    .rbadges { display: flex; gap: 5px; flex-wrap: wrap; }

    .badge { font-family: var(--px); font-size: 7px; padding: 4px 8px; letter-spacing: 1px; }

    .bs { background: var(--strike-bg); color: var(--strike); border: 1px solid rgba(96,165,250,.3); }
    .bb { background: var(--ball-bg);   color: var(--ball);   border: 1px solid rgba(52,211,153,.3); }
    .bo { background: var(--out-bg);    color: var(--out);    border: 1px solid rgba(248,113,113,.3); }
    .hi-digit-box { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: 1px solid var(--border); font-family: var(--px); font-size: 11px; cursor: pointer; transition: all .12s; background: var(--surface-3); }
    .hi-digit-box:hover { border-color: var(--out); }
    .hi-digit-box.x-elim { border-color: var(--out); color: var(--text-dim); text-decoration: line-through; background: var(--out-bg); opacity: .5; }
    .hi-num { display: flex; gap: 3px; }
    .hi-del { margin-left: auto; font-family: var(--px); font-size: 7px; padding: 3px 7px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; letter-spacing: 1px; transition: all .1s; align-self: center; }
    .hi-del:hover { border-color: var(--out); color: var(--out); }

    .ad-slot { width: 100%; max-width: 460px; margin-top: 1.25rem; }

    .ad-slot-label { font-family: var(--kr); font-size: 10px; color: var(--text-dim); text-align: center; margin-bottom: 4px; letter-spacing: 1px; }

    .ad-slot-inner { width: 100%; min-height: 100px; background: var(--surface); border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-family: var(--kr); font-size: 12px; }

    .bmc-wrap { margin-top: 1.5rem; text-align: center; }

    .bmc-btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; background: var(--surface); border: 1px solid var(--border-2); color: var(--text); text-decoration: none; cursor: pointer; transition: all .15s; }

    .bmc-btn:hover { border-color: #f5a623; color: #f5a623; box-shadow: 0 0 14px rgba(245,166,35,.18); }

    .bmc-icon { font-size: 15px; }

    .bmc-title { font-family: var(--px); font-size: 8px; letter-spacing: 1px; }

    .qr-modal { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; z-index: 2000; animation: fadein .15s ease; }

    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

    .qr-box { background: var(--surface); border: 1px solid var(--border-2); padding: 2rem 2.5rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .75rem; }

    .qr-box-title { font-family: var(--kr); font-size: 16px; font-weight: 600; color: var(--text-bright); }

    .qr-box img { display: block; border: 6px solid #fff; }

    .qr-box-sub { font-family: var(--kr); font-size: 12px; color: var(--text-dim); }

    .qr-close { font-family: var(--px); font-size: 7px; padding: 8px 18px; border: 1px solid var(--border-2); background: var(--surface-2); color: var(--text); cursor: pointer; letter-spacing: 1px; margin-top: .25rem; transition: background .1s; }

    .qr-close:hover { background: var(--surface-3); }

    .lang-btn { font-family: var(--px); font-size: 7px; padding: 3px 8px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); cursor: pointer; letter-spacing: 1px; transition: all .1s; }

    .lang-btn:hover { border-color: var(--amber); color: var(--amber); }

    footer { margin-top: 2rem; text-align: center; }

    .footer-main { font-family: var(--px); font-size: 7px; color: var(--text-dim); letter-spacing: 2px; margin-bottom: 6px; }

    .footer-sub { font-family: var(--kr); font-size: 12px; color: var(--text-dim); line-height: 1.8; }
    .footer-credit { font-family: var(--px); font-size: 7px; color: var(--text-dim); letter-spacing: 2px; margin-top: 8px; }

    @media (max-width: 420px) {
      body { padding: 1.5rem .75rem 4rem; }
      .header-title { font-size: clamp(.75rem, 6vw, 1.1rem); }
      .card-body { padding: 1rem; }
      .pd { font-size: 9px; }
      .dslot { height: 58px; font-size: 22px; }
      .npool { gap: 3px; }
      .dtoggle { flex-wrap: wrap; }
      .score-value { font-size: 14px; }
      .hi-num { font-size: 13px; min-width: 56px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-eyebrow">
    <div class="eyebrow-dot"></div>
    <span class="eyebrow-text">CLASSIC ARCADE GAME</span>
    <div class="eyebrow-dot"></div>
  </div>
  <div class="header-title">NUMBER<br><em>BASEBALL</em></div>
</header>

<div class="card">
  <div class="card-titlebar">
    <span class="card-titlebar-label">CONTROL PANEL</span>
    <div style="display:flex;align-items:center;gap:10px;">
      <button class="lang-btn" id="lang-btn" onclick="toggleLang()">EN</button>
      <div class="traffic-lights">
        <div class="tl tl-r"></div>
        <div class="tl tl-y"></div>
        <div class="tl tl-g"></div>
      </div>
    </div>
  </div>

  <div class="card-body">

    <div class="mode-toggle">
      <button class="mtbtn active" id="mode-game" onclick="setMode('game')">
        GAME
        <span class="mtbtn-desc" id="desc-game">숨겨진 수를 직접 맞춰요</span>
      </button>
      <button class="mtbtn" id="mode-helper" onclick="setMode('helper')">
        HELPER
        <span class="mtbtn-desc" id="desc-helper">친구와 대결할 때 사용해요</span>
      </button>
    </div>

    <div class="dtoggle">
      <span class="dtoggle-label">DIGITS:</span>
      <button class="tbtn"        id="btn3" onclick="setDigits(3)">3</button>
      <button class="tbtn active" id="btn4" onclick="setDigits(4)">4</button>
    </div>

    <div class="score-bar">
      <div class="score-item">
        <span class="score-label">TRIES</span>
        <span class="score-value" id="tries">000</span>
      </div>
      <span class="score-digits-badge" id="digits-badge">4-DIGIT</span>
    </div>

    <!-- ── SLOT AREA ── -->
    <div id="game-slot">
      <div class="drow" id="drow"></div>
    </div>

    <div id="helper-setup-slot" style="display:none;">
      <div class="secret-setup-header">
        <div class="secret-step-badge">STEP 1 / 2</div>
        <div class="secret-setup-title" id="label-set-secret">내 비밀 숫자를 정해주세요</div>
        <div class="secret-setup-desc" id="desc-set-secret">상대방이 맞춰야 할 숫자예요</div>
      </div>
      <div class="drow secret-drow" id="sdrow"></div>
    </div>

    <div id="helper-main-slot" style="display:none;">
      <div class="my-secret-bar">
        <span class="my-secret-lbl" id="label-my-secret-bar">MY SECRET</span>
        <span class="my-secret-dots" id="my-secret-dots"></span>
        <button class="mini-btn" onclick="resetMySecret()" id="btn-change">CHANGE</button>
      </div>
      <div class="helper-tab-toggle">
        <button class="htbtn active" id="tab-my" onclick="setHelperTab('my')">
          MY TURN<span class="htbtn-desc" id="desc-my-turn">내가 추측할 때</span>
        </button>
        <button class="htbtn" id="tab-their" onclick="setHelperTab('their')">
          THEIR TURN<span class="htbtn-desc" id="desc-their-turn">상대가 추측할 때</span>
        </button>
      </div>
      <div id="helper-my-slot"><div class="drow" id="hdrow"></div></div>
      <div id="helper-their-slot" style="display:none;"><div class="drow" id="tdrow"></div></div>
    </div>

    <!-- ── NUMBER POOL (슬롯 바로 아래) ── -->
    <div class="section-label" id="label-pick">PICK A NUMBER</div>
    <div class="npool" id="npool"></div>

    <!-- ── CONTROLS AREA ── -->
    <div id="game-controls">
      <div class="btnrow">
        <button class="abtn" onclick="clearLast()">⌫ DEL</button>
        <button class="abtn primary" id="subbtn" onclick="submitGuess()">ENTER ↵</button>
        <button class="abtn" onclick="startGame()">NEW GAME</button>
      </div>
    </div>

    <div id="helper-setup-controls" style="display:none;">
      <div class="smsg" id="smsg-setup"></div>
      <div class="btnrow">
        <button class="abtn" onclick="clearLastS()">⌫ DEL</button>
        <button class="abtn primary" onclick="setMySecret()" id="btn-start-game">START GAME ↵</button>
      </div>
    </div>

    <div id="helper-my-controls" style="display:none;">
      <div class="result-select-group">
        <div class="result-select-row"><span class="rlabel">S</span><div class="result-btns" id="strike-btns"></div></div>
        <div class="result-select-row"><span class="rlabel">B</span><div class="result-btns" id="ball-btns"></div></div>
      </div>
      <div class="btnrow">
        <button class="abtn" onclick="clearLastH()">⌫ DEL</button>
        <button class="abtn primary" onclick="submitHelper()">LOG ↵</button>
        <button class="abtn" onclick="undoHelper()">UNDO</button>
        <button class="abtn" onclick="startGame()">RESET</button>
      </div>
    </div>

    <div id="helper-their-controls" style="display:none;">
      <div id="their-result" style="display:none;"></div>
      <div class="btnrow">
        <button class="abtn" onclick="clearLastT()">⌫ DEL</button>
        <button class="abtn primary" onclick="submitTheirGuess()">CHECK ↵</button>
        <button class="abtn" onclick="undoTheirGuess()">UNDO</button>
        <button class="abtn" onclick="startGame()">RESET</button>
      </div>
    </div>

    <div class="smsg" id="smsg"></div>
    <div id="winarea"></div>

    <div id="history-section" style="display:none;">
      <div class="divider"></div>
      <div class="history-header">── HISTORY ──</div>
      <div class="hbox" id="hbox"></div>
      <div class="hbox" id="hbox-my" style="display:none;"></div>
      <div class="hbox" id="hbox-their" style="display:none;"></div>
    </div>

  </div>
</div>

<div class="ad-slot">
  <div class="ad-slot-label" id="label-ad">광고</div>
  <div class="ad-slot-inner" id="ad-container"></div>
</div>

    <div class="qr-box-title" id="qr-box-title">☕ 카카오페이 송금</div>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&color=000000&bgcolor=ffffff&data=https://qr.kakaopay.com/Ej7wPpW3m1f408605" alt="카카오페이 QR" width="180" height="180">
    <div class="qr-box-sub" id="qr-box-sub">QR코드를 스캔해 주세요</div>

  </div>

<footer>
  <div class="footer-main">⚾ NUMBER BASEBALL · v1.0.10</div>
  <div class="footer-sub" id="footer-sub">숫자를 눌러 입력 · ENTER로 제출 · Backspace로 삭제</div>
  <div class="footer-credit">made by heebong</div>
</footer>

<script>
  var secret = '', tries = 0, gameOver = false, digits = 4;
  var current = [], hcurrent = [], eliminated = {};
  var cursor = 0, hcursor = 0;
  var mySecret = '', helperTab = 'my';
  var selStrike = 0, selBall = 0;
  var historyStack = [];
  var scurrent = [], scursor = 0;
  var tcurrent = [], tcursor = 0;
  var ORDER = ['1','2','3','4','5','6','7','8','9','0'];
  var mode = 'game';
  var lang = 'ko';

  var T = {
    ko: {
      headerSub:      '숫자야구',
      gameDesc:       '숨겨진 수를 직접 맞춰요',
      helperDesc:     '친구와 대결할 때 사용해요',
      adLabel:        '광고',
      qrTitle:        '☕ 카카오페이 송금',
      qrSub:          'QR코드를 스캔해 주세요',
      footerSub:      '숫자를 눌러 입력 · ENTER로 제출 · Backspace로 삭제',
      setSecret:      '내 비밀 숫자를 정해주세요',
      descSetSecret:  '상대방이 맞춰야 할 숫자예요',
      myTurnDesc:     '내가 추측할 때',
      theirTurnDesc:  '상대가 추측할 때',
      mySecretBar:    'MY SECRET',
      btnChange:      'CHANGE',
      msgFull:        function(n) { return '이미 ' + n + '자리를 입력했어요'; },
      msgDup:         '이미 입력된 숫자예요',
      msgNoZero:      '첫 번째 자리는 0이 될 수 없어요',
      msgEnterAll:    function(n) { return n + '자리를 모두 입력해 주세요'; },
      msgExceed:      function(n) { return '스트라이크 + 볼은 ' + n + '를 초과할 수 없어요'; },
      winGame:        function(n) { return n + '번 만에 정답을 맞혔어요'; },
      winHelper:      function(n) { return n + '번 만에 정답을 찾았어요'; },
    },
    en: {
      headerSub:      'Number Baseball',
      gameDesc:       'Guess the hidden number',
      helperDesc:     'Use when playing with a friend',
      adLabel:        'Ad',
      qrTitle:        '☕ KakaoPay Transfer',
      qrSub:          'Scan the QR code to send',
      footerSub:      'Click numbers · ENTER to submit · Backspace to delete',
      setSecret:      'Set your secret number',
      descSetSecret:  'Your opponent has to guess this',
      myTurnDesc:     'When I guess',
      theirTurnDesc:  'When they guess',
      mySecretBar:    'MY SECRET',
      btnChange:      'CHANGE',
      msgFull:        function(n) { return 'Already ' + n + ' digits entered!'; },
      msgDup:         'That number is already in!',
      msgNoZero:      'First digit cannot be 0',
      msgEnterAll:    function(n) { return 'Enter all ' + n + ' digits first'; },
      msgExceed:      function(n) { return 'Strike + Ball cannot exceed ' + n; },
      winGame:        function(n) { return 'Solved in ' + n + ' tries!'; },
      winHelper:      function(n) { return 'Found in ' + n + ' tries!'; },
    }
  };

  function toggleLang() {
    lang = lang === 'ko' ? 'en' : 'ko';
    document.documentElement.lang = lang;
    applyLang();
  }

  function applyLang() {
    var t = T[lang];
    document.getElementById('lang-btn').textContent            = lang === 'ko' ? 'EN' : 'KO';
    document.getElementById('desc-game').textContent           = t.gameDesc;
    document.getElementById('desc-helper').textContent         = t.helperDesc;
    document.getElementById('label-ad').textContent            = t.adLabel;
    document.getElementById('qr-box-title').textContent        = t.qrTitle;
    document.getElementById('qr-box-sub').textContent          = t.qrSub;
    document.getElementById('footer-sub').textContent          = t.footerSub;
    document.getElementById('label-set-secret').textContent    = t.setSecret;
    document.getElementById('desc-set-secret').textContent     = t.descSetSecret;
    document.getElementById('desc-my-turn').textContent        = t.myTurnDesc;
    document.getElementById('desc-their-turn').textContent     = t.theirTurnDesc;
    document.getElementById('label-my-secret-bar').textContent = t.mySecretBar;
    document.getElementById('btn-change').textContent          = t.btnChange;
  }

  function fmt(n)     { return String(n).padStart(3, '0'); }
  function setMsg(m)  { document.getElementById('smsg').textContent = m; }
  function clearMsg() { document.getElementById('smsg').textContent = ''; }

  function setMode(m) {
    mode = m;
    document.getElementById('mode-game').className   = 'mtbtn' + (m === 'game'   ? ' active' : '');
    document.getElementById('mode-helper').className = 'mtbtn' + (m === 'helper' ? ' active' : '');
    startGame();
  }

  function setDigits(n) {
    digits = n;
    document.getElementById('btn3').className = 'tbtn' + (n === 3 ? ' active' : '');
    document.getElementById('btn4').className = 'tbtn' + (n === 4 ? ' active' : '');
    document.getElementById('digits-badge').textContent = n + '-DIGIT';
    document.documentElement.style.setProperty('--digits', n);
    startGame();
  }

  function genSecret() {
    var pool = ORDER.slice().sort(function() { return Math.random() - .5; }).slice(0, digits);
    if (pool[0] === '0') { var i = Math.floor(Math.random() * (digits - 1)) + 1; var t = pool[0]; pool[0] = pool[i]; pool[i] = t; }
    return pool.join('');
  }

  function startGame() {
    secret = genSecret();
    tries = 0; gameOver = false;
    current  = new Array(digits).fill(null); cursor  = 0;
    hcurrent = new Array(digits).fill(null); hcursor = 0;
    scurrent = new Array(digits).fill(null); scursor = 0;
    tcurrent = new Array(digits).fill(null); tcursor = 0;
    mySecret = ''; helperTab = 'my';
    selStrike = 0; selBall = 0;
    eliminated = {};
    historyStack = [];
    document.getElementById('tries').textContent = '000';
    document.getElementById('hbox').innerHTML = '';
    document.getElementById('hbox-my').innerHTML = '';
    document.getElementById('hbox-their').innerHTML = '';
    document.getElementById('winarea').innerHTML = '';
    document.getElementById('history-section').style.display = 'none';
    clearMsg();
    var sb = document.getElementById('subbtn');
    if (sb) sb.disabled = false;
    document.documentElement.style.setProperty('--digits', digits);
    var isGame   = mode === 'game';
    var isHelper = mode === 'helper';
    document.getElementById('game-slot').style.display             = isGame   ? '' : 'none';
    document.getElementById('game-controls').style.display         = isGame   ? '' : 'none';
    document.getElementById('helper-setup-slot').style.display     = isHelper ? '' : 'none';
    document.getElementById('helper-setup-controls').style.display = isHelper ? '' : 'none';
    document.getElementById('helper-main-slot').style.display      = 'none';
    document.getElementById('helper-my-controls').style.display    = 'none';
    document.getElementById('helper-their-controls').style.display = 'none';
    if (isHelper) {
      document.getElementById('smsg-setup').textContent = '';
      document.getElementById('their-result').style.display = 'none';
      renderDisplayS();
    }
    renderPool(); renderDisplay(); renderDisplayH(); renderDisplayT(); renderResultBtns();
    applyLang();
  }

  /* ── RENDER POOL ── */
  function isHistoryElim(d) {
    for (var i = 0; i < historyStack.length; i++) {
      var item = historyStack[i];
      if (!item.digitElim || item.isTheir) continue;
      for (var j = 0; j < item.guess.length; j++) {
        if (item.guess[j] === d && item.digitElim[j]) return true;
      }
    }
    return false;
  }

  function renderPool() {
    var c = document.getElementById('npool');
    c.innerHTML = '';
    for (var i = 0; i < ORDER.length; i++) {
      var d = ORDER[i];
      var el = document.createElement('div');
      el.className = 'pd' + ((eliminated[d] || (helperTab !== 'their' && isHistoryElim(d))) ? ' elim' : '');
      el.textContent = d;
      (function(digit) {
        el.addEventListener('click', function() {
          if (mode === 'game') {
            addDigit(digit);
          } else if (mode === 'helper') {
            if (!mySecret) addSecretDigit(digit);
            else if (helperTab === 'my') addDigitH(digit);
            else addDigitT(digit);
          }
        });
      })(d);
      c.appendChild(el);
    }
  }

  /* ── RENDER GAME DISPLAY ── */
  function renderDisplay() {
    var row = document.getElementById('drow');
    row.innerHTML = '';
    for (var i = 0; i < digits; i++) {
      var slot = document.createElement('div');
      slot.className = 'dslot' + (current[i] ? ' filled' : '') + (!current[i] && i === cursor ? ' cursor-slot' : '');
      if (current[i]) { slot.textContent = current[i]; }
      else { var h = document.createElement('span'); h.className = 'slothint'; h.textContent = i + 1; slot.appendChild(h); }
      (function(idx) {
        slot.addEventListener('click', function() {
          if (gameOver) return;
          if (current[idx]) { current[idx] = null; }
          cursor = idx; clearMsg(); renderDisplay();
        });
      })(i);
      row.appendChild(slot);
    }
  }

  /* ── RENDER MY TURN (HELPER) ── */
  function renderDisplayH() {
    var row = document.getElementById('hdrow');
    row.innerHTML = '';
    for (var i = 0; i < digits; i++) {
      var slot = document.createElement('div');
      slot.className = 'dslot' + (hcurrent[i] ? ' filled' : '') + (!hcurrent[i] && i === hcursor ? ' cursor-slot' : '');
      if (hcurrent[i]) { slot.textContent = hcurrent[i]; }
      else { var h = document.createElement('span'); h.className = 'slothint'; h.textContent = i + 1; slot.appendChild(h); }
      (function(idx) {
        slot.addEventListener('click', function() {
          if (hcurrent[idx]) { hcurrent[idx] = null; }
          hcursor = idx; clearMsg(); renderDisplayH();
        });
      })(i);
      row.appendChild(slot);
    }
  }

  /* ── RENDER SECRET SETUP ── */
  function renderDisplayS() {
    var row = document.getElementById('sdrow');
    if (!row) return;
    row.innerHTML = '';
    for (var i = 0; i < digits; i++) {
      var slot = document.createElement('div');
      slot.className = 'dslot' + (scurrent[i] ? ' filled' : '') + (!scurrent[i] && i === scursor ? ' cursor-slot' : '');
      if (scurrent[i]) {
        slot.textContent = scurrent[i];
      } else {
        var h = document.createElement('span'); h.className = 'slothint'; h.textContent = i + 1; slot.appendChild(h);
      }
      (function(idx) {
        slot.addEventListener('click', function() {
          if (scurrent[idx]) { scurrent[idx] = null; }
          scursor = idx;
          document.getElementById('smsg-setup').textContent = '';
          renderDisplayS();
        });
      })(i);
      row.appendChild(slot);
    }
  }

  /* ── RENDER THEIR TURN ── */
  function renderDisplayT() {
    var row = document.getElementById('tdrow');
    if (!row) return;
    row.innerHTML = '';
    for (var i = 0; i < digits; i++) {
      var slot = document.createElement('div');
      slot.className = 'dslot' + (tcurrent[i] ? ' filled' : '') + (!tcurrent[i] && i === tcursor ? ' cursor-slot' : '');
      if (tcurrent[i]) { slot.textContent = tcurrent[i]; }
      else { var h = document.createElement('span'); h.className = 'slothint'; h.textContent = i + 1; slot.appendChild(h); }
      (function(idx) {
        slot.addEventListener('click', function() {
          if (tcurrent[idx]) { tcurrent[idx] = null; }
          tcursor = idx; clearMsg(); renderDisplayT();
        });
      })(i);
      row.appendChild(slot);
    }
  }

  /* ── INPUT HELPERS ── */
  function addToSlot(arr, cur, setCursor, d, onUpdate) {
    var count = 0; for (var i = 0; i < digits; i++) if (arr[i]) count++;
    if (count >= digits) { setMsg(T[lang].msgFull(digits)); return cur; }
    for (var i = 0; i < digits; i++) { if (arr[i] === d) { setMsg(T[lang].msgDup); return cur; } }
    var target = (cur < digits && !arr[cur]) ? cur : -1;
    if (target === -1) { for (var i = 0; i < digits; i++) { if (!arr[i]) { target = i; break; } } }
    if (target === -1) { setMsg(T[lang].msgFull(digits)); return cur; }
    if (target === 0 && d === '0') { setMsg(T[lang].msgNoZero); return cur; }
    clearMsg();
    arr[target] = d;
    var next = -1;
    for (var i = target + 1; i < digits; i++) { if (!arr[i]) { next = i; break; } }
    if (next === -1) for (var i = 0; i < target; i++) { if (!arr[i]) { next = i; break; } }
    var newCur = next === -1 ? digits : next;
    onUpdate(target);
    return newCur;
  }

  function addDigit(d) {
    if (gameOver) return;
    cursor = addToSlot(current, cursor, cursor, d, function(target) {
      renderDisplay();
      var slots = document.getElementById('drow').querySelectorAll('.dslot');
      var s = slots[target];
      if (s) { s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); }
    });
  }

  function addDigitH(d) {
    hcursor = addToSlot(hcurrent, hcursor, hcursor, d, function() { renderDisplayH(); });
  }

  function addSecretDigit(d) {
    var count = 0; for (var i = 0; i < digits; i++) if (scurrent[i]) count++;
    if (count >= digits) return;
    for (var i = 0; i < digits; i++) { if (scurrent[i] === d) return; }
    var target = (scursor < digits && !scurrent[scursor]) ? scursor : -1;
    if (target === -1) { for (var i = 0; i < digits; i++) { if (!scurrent[i]) { target = i; break; } } }
    if (target === -1) return;
    if (target === 0 && d === '0') { document.getElementById('smsg-setup').textContent = T[lang].msgNoZero; return; }
    scurrent[target] = d;
    var next = -1;
    for (var i = target + 1; i < digits; i++) { if (!scurrent[i]) { next = i; break; } }
    scursor = next === -1 ? digits : next;
    renderDisplayS();
  }

  function addDigitT(d) {
    tcursor = addToSlot(tcurrent, tcursor, tcursor, d, function() { renderDisplayT(); });
  }

  function clearLast() {
    if (gameOver) return;
    for (var i = digits - 1; i >= 0; i--) { if (current[i]) { current[i] = null; cursor = i; break; } }
    renderDisplay();
  }

  function clearLastH() {
    for (var i = digits - 1; i >= 0; i--) { if (hcurrent[i]) { hcurrent[i] = null; hcursor = i; break; } }
    renderDisplayH();
  }

  function clearLastS() {
    for (var i = digits - 1; i >= 0; i--) { if (scurrent[i]) { scurrent[i] = null; scursor = i; break; } }
    renderDisplayS();
  }

  function clearLastT() {
    for (var i = digits - 1; i >= 0; i--) { if (tcurrent[i]) { tcurrent[i] = null; tcursor = i; break; } }
    renderDisplayT();
    document.getElementById('their-result').style.display = 'none';
  }

  /* ── SET / RESET SECRET ── */
  function setMySecret() {
    var count = 0; for (var i = 0; i < digits; i++) if (scurrent[i]) count++;
    if (count !== digits) { document.getElementById('smsg-setup').textContent = T[lang].msgEnterAll(digits); return; }
    mySecret = scurrent.join('');
    document.getElementById('helper-setup-slot').style.display     = 'none';
    document.getElementById('helper-setup-controls').style.display = 'none';
    document.getElementById('helper-main-slot').style.display      = '';
    document.getElementById('my-secret-dots').textContent = mySecret;
    setHelperTab('my');
  }

  function resetMySecret() {
    mySecret = '';
    scurrent = new Array(digits).fill(null); scursor = 0;
    document.getElementById('helper-setup-slot').style.display     = '';
    document.getElementById('helper-setup-controls').style.display = '';
    document.getElementById('helper-main-slot').style.display      = 'none';
    document.getElementById('helper-my-controls').style.display    = 'none';
    document.getElementById('helper-their-controls').style.display = 'none';
    document.getElementById('smsg-setup').textContent = '';
    renderDisplayS();
  }

  function setHelperTab(tab) {
    helperTab = tab;
    document.getElementById('tab-my').className    = 'htbtn' + (tab === 'my'    ? ' active' : '');
    document.getElementById('tab-their').className = 'htbtn' + (tab === 'their' ? ' active' : '');
    document.getElementById('helper-my-slot').style.display       = tab === 'my'    ? '' : 'none';
    document.getElementById('helper-their-slot').style.display    = tab === 'their' ? '' : 'none';
    document.getElementById('helper-my-controls').style.display   = tab === 'my'    ? '' : 'none';
    document.getElementById('helper-their-controls').style.display= tab === 'their' ? '' : 'none';
    var hboxMy    = document.getElementById('hbox-my');
    var hboxTheir = document.getElementById('hbox-their');
    hboxMy.style.display    = tab === 'my'    ? '' : 'none';
    hboxTheir.style.display = tab === 'their' ? '' : 'none';
    var hasHistory = (tab === 'my' ? hboxMy : hboxTheir).children.length > 0;
    document.getElementById('history-section').style.display = hasHistory ? '' : 'none';
    renderPool();
    clearMsg();
  }

  /* ── SUBMIT GAME ── */
  function submitGuess() {
    if (gameOver) return;
    var count = 0; for (var i = 0; i < digits; i++) if (current[i]) count++;
    if (count !== digits) { setMsg(T[lang].msgEnterAll(digits)); return; }
    var guess = current.join('');
    clearMsg();
    tries++; document.getElementById('tries').textContent = fmt(tries);
    var s = 0, b = 0;
    for (var i = 0; i < digits; i++) {
      if (guess[i] === secret[i]) s++;
      else if (secret.indexOf(guess[i]) >= 0) b++;
    }
    var isOut = (s === 0 && b === 0);
    if (isOut) { for (var i = 0; i < digits; i++) eliminated[guess[i]] = true; }
    renderPool();
    addHistory(guess, s, b, isOut, false);
    current = new Array(digits).fill(null); cursor = 0; renderDisplay();
    if (s === digits) {
      gameOver = true;
      document.getElementById('subbtn').disabled = true;
      document.getElementById('winarea').innerHTML = '<div class="wmsg"><div class="wmsg-title">PERFECT!</div><div class="wmsg-sub">' + T[lang].winGame(tries) + '</div></div>';
    }
  }

  /* ── UNDO ── */
  function undoHelper() {
    var last = historyStack[historyStack.length - 1];
    if (!last || last.isTheir) return;
    historyStack.pop();
    tries--; document.getElementById('tries').textContent = fmt(tries);
    var hbox = document.getElementById('hbox-my');
    if (hbox.firstChild) hbox.removeChild(hbox.firstChild);
    if (hbox.firstChild) {
      var nextDel = hbox.firstChild.querySelector('.hi-del');
      if (nextDel) nextDel.style.display = '';
    }
    document.getElementById('history-section').style.display = hbox.children.length > 0 ? '' : 'none';
    renderPool(); clearMsg();
  }

  function undoTheirGuess() {
    var last = historyStack[historyStack.length - 1];
    if (!last || !last.isTheir) return;
    historyStack.pop();
    var hbox = document.getElementById('hbox-their');
    if (hbox.firstChild) hbox.removeChild(hbox.firstChild);
    if (hbox.firstChild) {
      var nextDel = hbox.firstChild.querySelector('.hi-del');
      if (nextDel) nextDel.style.display = '';
    }
    document.getElementById('history-section').style.display = hbox.children.length > 0 ? '' : 'none';
    document.getElementById('their-result').style.display = 'none';
    clearMsg();
  }

  /* ── RESULT BUTTONS ── */
  function renderResultBtns() {
    var sEl = document.getElementById('strike-btns');
    var bEl = document.getElementById('ball-btns');
    if (!sEl) return;
    sEl.innerHTML = ''; bEl.innerHTML = '';
    for (var i = 0; i <= digits; i++) {
      (function(n) {
        var sb = document.createElement('button');
        sb.className = 'rbtn' + (n === selStrike ? ' active' : '');
        sb.textContent = n;
        sb.disabled = (n + selBall > digits);
        sb.onclick = function() { selStrike = n; renderResultBtns(); };
        sEl.appendChild(sb);
        var bb = document.createElement('button');
        bb.className = 'rbtn' + (n === selBall ? ' active' : '');
        bb.textContent = n;
        bb.disabled = (selStrike + n > digits);
        bb.onclick = function() { selBall = n; renderResultBtns(); };
        bEl.appendChild(bb);
      })(i);
    }
  }

  /* ── SUBMIT HELPER MY TURN ── */
  function submitHelper() {
    var count = 0; for (var i = 0; i < digits; i++) if (hcurrent[i]) count++;
    if (count !== digits) { setMsg(T[lang].msgEnterAll(digits)); return; }
    var guess = hcurrent.join('');
    var s = selStrike, b = selBall;
    clearMsg();
    tries++; document.getElementById('tries').textContent = fmt(tries);
    var isOut = (s === 0 && b === 0);
    addHistory(guess, s, b, isOut, false);
    renderPool();
    hcurrent = new Array(digits).fill(null); hcursor = 0; renderDisplayH();
    selStrike = 0; selBall = 0; renderResultBtns();
    if (s === digits) {
      document.getElementById('winarea').innerHTML = '<div class="wmsg"><div class="wmsg-title">FOUND IT!</div><div class="wmsg-sub">' + T[lang].winHelper(tries) + '</div></div>';
    }
  }

  /* ── SUBMIT THEIR TURN (자동 계산) ── */
  function submitTheirGuess() {
    var count = 0; for (var i = 0; i < digits; i++) if (tcurrent[i]) count++;
    if (count !== digits) { setMsg(T[lang].msgEnterAll(digits)); return; }
    var guess = tcurrent.join('');
    clearMsg();
    var s = 0, b = 0;
    for (var i = 0; i < digits; i++) {
      if (guess[i] === mySecret[i]) s++;
      else if (mySecret.indexOf(guess[i]) >= 0) b++;
    }
    var isOut = (s === 0 && b === 0);
    var html = '<div class="their-result-box">';
    if (s > 0) html += '<span class="badge bs">' + s + 'S</span>';
    if (b > 0) html += '<span class="badge bb">' + b + 'B</span>';
    if (isOut) html += '<span class="badge bo">OUT</span>';
    if (s === digits) html += '<span class="badge bs" style="background:var(--amber-glow);color:var(--amber);border-color:var(--amber);">PERFECT!</span>';
    html += '</div>';
    var resultEl = document.getElementById('their-result');
    resultEl.innerHTML = html;
    resultEl.style.display = '';
    addHistory(guess, s, b, isOut, true);
    renderPool();
    tcurrent = new Array(digits).fill(null); tcursor = 0; renderDisplayT();
  }

  /* ── HISTORY ── */
  function addHistory(guess, s, b, isOut, isTheir) {
    var digitElim = (isOut && mode === 'helper' && !isTheir) ? new Array(guess.length).fill(true) : new Array(guess.length).fill(false);
    historyStack.push({ guess: guess, s: s, b: b, isOut: isOut, isTheir: isTheir, digitElim: digitElim });
    var stackIdx = historyStack.length - 1;
    var item = document.createElement('div');
    item.className = 'hi' + (isTheir ? ' their' : '');
    item.dataset.histIdx = stackIdx;
    var left = document.createElement('div');
    left.style.display = 'flex'; left.style.flexDirection = 'column'; left.style.gap = '3px';
    var num = document.createElement('div'); num.className = 'hi-num';
    for (var ci = 0; ci < guess.length; ci++) {
      (function(ch, pos) {
        var box = document.createElement('div');
        box.className = 'hi-digit-box' + (digitElim[pos] ? ' x-elim' : '');
        box.textContent = ch;
        if (!isTheir) {
          box.addEventListener('click', function(e) {
            e.stopPropagation();
            historyStack[stackIdx].digitElim[pos] = !historyStack[stackIdx].digitElim[pos];
            box.className = 'hi-digit-box' + (historyStack[stackIdx].digitElim[pos] ? ' x-elim' : '');
            renderPool();
          });
        }
        num.appendChild(box);
      })(guess[ci], ci);
    }
    left.appendChild(num);
    if (isTheir !== undefined && mode === 'helper') {
      var who = document.createElement('span'); who.className = 'hi-who';
      who.textContent = isTheir ? 'THEIR' : 'MINE';
      left.appendChild(who);
    }
    var badges = document.createElement('div'); badges.className = 'rbadges';
    if (s > 0) { var bd = document.createElement('span'); bd.className = 'badge bs'; bd.textContent = s + 'S'; badges.appendChild(bd); }
    if (b > 0) { var bd = document.createElement('span'); bd.className = 'badge bb'; bd.textContent = b + 'B'; badges.appendChild(bd); }
    if (isOut) { var bd = document.createElement('span'); bd.className = 'badge bo'; bd.textContent = 'OUT';  badges.appendChild(bd); }
    var delBtn = document.createElement('button');
    delBtn.className = 'hi-del';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (isTheir) undoTheirGuess(); else undoHelper();
    });
    item.appendChild(left); item.appendChild(badges); item.appendChild(delBtn);
    var hboxId = (mode === 'helper') ? (isTheir ? 'hbox-their' : 'hbox-my') : 'hbox';
    var hbox = document.getElementById(hboxId);
    // 이전 첫 항목의 ✕ 버튼 숨김
    if (hbox.firstChild) {
      var prevDel = hbox.firstChild.querySelector('.hi-del');
      if (prevDel) prevDel.style.display = 'none';
    }
    document.getElementById('history-section').style.display = '';
    hbox.insertBefore(item, hbox.firstChild);
    setTimeout(function() { item.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 50);
  }

  /* ── KEYBOARD ── */
  document.addEventListener('keydown', function(e) {
    if (e.key >= '0' && e.key <= '9') {
      if (mode === 'game' && !gameOver) addDigit(e.key);
      else if (mode === 'helper') {
        if (!mySecret) addSecretDigit(e.key);
        else if (helperTab === 'my') addDigitH(e.key);
        else addDigitT(e.key);
      }
    } else if (e.key === 'Backspace') {
      if (mode === 'game' && !gameOver) clearLast();
      else if (mode === 'helper') {
        if (!mySecret) clearLastS();
        else if (helperTab === 'my') clearLastH();
        else clearLastT();
      }
    } else if (e.key === 'Enter') {
      if (mode === 'game' && !gameOver) submitGuess();
      else if (mode === 'helper') {
        if (!mySecret) setMySecret();
        else if (helperTab === 'my') submitHelper();
        else submitTheirGuess();
      }
    }
  });

  /* ── KAKAO PAY QR ── */
  function isMobile() { return 'ontouchstart' in window || navigator.maxTouchPoints > 0; }

  function handleBmc(e) {
    if (isMobile()) return;
    e.preventDefault();
    document.getElementById('qr-modal').style.display = 'flex';
  }

  function closeQr() { document.getElementById('qr-modal').style.display = 'none'; }

  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeQr(); });

  startGame();
</script>
</body>
</html>
